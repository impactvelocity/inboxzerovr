<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17151e"><title>Kyoto · VR3</title></head>
<body>
<div id="scene" aria-label="Immersive Kyoto garden. Drag or use arrow keys to look around." tabindex="0"></div>
<header id="heading"><span class="eyebrow">VR3 / AN ATMOSPHERE STUDY</span><h1>After the rain.</h1><p>Kyoto garden <span>·</span> Stay a little longer.</p></header>
<div id="loading" role="status">Opening the garden…</div>
<aside id="controls" aria-label="Garden controls">
 <div class="time-label"><span id="phase">Dusk</span><span id="progress">00:00 / 00:20</span></div>
 <label class="sr-only" for="mood">Time of evening</label><input id="mood" type="range" min="0" max="1" step="0.001" value="0">
 <div class="range-labels"><span>DUSK</span><span>TWILIGHT</span></div>
 <div class="actions"><button id="play" aria-pressed="true">Pause transition</button><button id="restart" aria-label="Restart evening transition">↺</button><button id="vr" disabled>Checking VR…</button></div>
 <button id="swing">Preview sword swing</button>
 <details><summary>Atmosphere</summary><div class="settings"><label for="music">Music</label><input id="music" type="checkbox" checked><label for="volume">Volume</label><input id="volume" type="range" min="0" max="1" step="0.01" value="0.5"><label for="sounds">Sounds</label><input id="sounds" type="checkbox" checked><label for="sounds-volume">Sound vol.</label><input id="sounds-volume" type="range" min="0" max="1" step="0.01" value="0.7"><label for="pace">Transition</label><select id="pace"><option value="20" selected>Demo · 20 seconds</option><option value="60">One minute</option><option value="180">Relaxed · 3 minutes</option></select><label for="depth">Depth</label><input id="depth" type="range" min="0" max="1" step="0.01" value="0.6"><label for="wind">Breeze</label><input id="wind" type="range" min="0" max="1" step="0.01" value="0.35"><label for="motion">Motion</label><input id="motion" type="checkbox" checked><label for="quality">Detail</label><select id="quality"><option value="low">Light</option><option value="high" selected>Full</option></select></div></details>
 <p id="audio-status" role="status">Music starts in VR</p><p id="hint">Drag to look around · H to hide controls</p><p id="xr-status" role="status"></p>
</aside><button id="show-ui" aria-label="Show garden controls">Show controls</button>
<script type="module" src="/src/main.ts"></script></body></html>
