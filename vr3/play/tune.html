<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weapon Tuning</title>
<style>
/* (big, to be read and used with the headset on: 2026-11-12, "make the tune controls much bigger", then "less big": three quarters of that) */
:root{--bg:#1d1e24;--panel:#26272f;--line:#4a4c58;--text:#f2f2f7;--dim:#b4b6c4;--accent:#7dffc9;--x:#ff6b6b;--y:#5fe08a;--z:#6aa8ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:18px/1.35 system-ui,-apple-system,sans-serif}
body{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,40vw);height:100vh}
#view{position:relative;min-height:0}#view canvas{display:block;width:100%;height:100%;cursor:grab}
#legend{position:absolute;left:10px;bottom:10px;right:10px;background:#000a;padding:8px 10px;border-radius:8px;font-size:15px;color:var(--dim);pointer-events:none}
#legend b{font-weight:700}.x{color:var(--x)}.y{color:var(--y)}.z{color:var(--z)}
#cams{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
#cams button{background:#000a;color:var(--text);border:2px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:15px;cursor:pointer}
#cams button.on{border-color:var(--accent);color:var(--accent)}
aside{background:var(--panel);border-left:2px solid var(--line);padding:16px;overflow:auto}
h1{font-size:26px;margin:0 0 4px}p.note{margin:0 0 12px;color:var(--dim);font-size:15px}
#status{font-size:18px;padding:9px 12px;border-radius:8px;background:#0004;margin-bottom:14px}
#status .ok{color:var(--accent);font-weight:700}#status .no{color:#ffb86b;font-weight:700}
label.pick{display:block;margin-bottom:14px;font-weight:700}select{width:100%;margin-top:4px;background:#1b1c22;color:var(--text);border:2px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-weight:400}
fieldset{border:2px solid var(--line);border-radius:10px;padding:9px 12px 4px;margin:0 0 14px}legend{color:var(--dim);font-size:15px;padding:0 4px;text-transform:uppercase;letter-spacing:.05em}
.row{margin-bottom:14px}.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.row .top b{font-size:20px}.row .top span{color:var(--dim);font-size:15px}
.row .ctl{display:flex;align-items:center;gap:9px;margin-top:6px}
.row input[type=range]{flex:1;height:33px;accent-color:var(--accent);-webkit-appearance:none;appearance:none;background:transparent}
.row input[type=range]::-webkit-slider-runnable-track{height:9px;border-radius:4px;background:#4a4c58}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:var(--accent);border:3px solid #10151a}
.row input[type=range]::-moz-range-track{height:9px;border-radius:4px;background:#4a4c58}
.row input[type=range]::-moz-range-thumb{width:27px;height:27px;border-radius:50%;background:var(--accent);border:3px solid #10151a}
.row input[type=number]{width:82px;background:#1b1c22;color:var(--text);border:2px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:21px;font-weight:700;text-align:center}
.row button{width:42px;height:42px;background:#1b1c22;color:var(--text);border:2px solid var(--line);border-radius:9px;cursor:pointer;padding:0;font-size:24px;line-height:1}
.row button:active,.actions button:active{background:#333644}
.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{flex:1;min-height:48px;background:#1b1c22;color:var(--text);border:2px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-weight:700;cursor:pointer}
.actions button:disabled{opacity:.35;cursor:default}
.actions button.main{border-color:var(--accent);color:var(--accent)}
pre{background:#0005;border-radius:8px;padding:9px;font-size:16px;white-space:pre-wrap;word-break:break-word;color:var(--text);margin:12px 0 0}
@media(max-width:825px){body{grid-template-columns:1fr;grid-template-rows:42vh auto;height:auto}#view{height:42vh}aside{border-left:0;border-top:2px solid var(--line)}}
#toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-140%);z-index:9;background:#123b2e;color:var(--accent);border:2px solid var(--accent);border-radius:12px;padding:14px 22px;font-size:22px;font-weight:700;box-shadow:0 10px 40px #000a;transition:transform .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
.row .set{display:flex;flex-direction:column;align-items:flex-end;min-width:86px;line-height:1.15;text-align:right}
.row .set b{font-size:20px;color:var(--accent)}.row .set.zero b{color:var(--dim)}
.row .set i{font-style:normal;font-size:13px;color:var(--dim)}
</style></head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<div id="view"><div id="cams"></div><div id="legend"><b class="x">red</b> your right · <b class="y">green</b> towards the knuckles · <b class="z">blue</b> out past the thumb · grey: the fist</div></div>
<aside>
 <h1>Weapon tuning</h1>
 <p class="note">Turn and move a weapon about the fist. Every change goes straight to the game on the headset (this dev server only), in VR or not.</p>
 <div id="status">Looking for the headset…</div>
 <label class="pick">Level <select id="level"></select></label>
 <fieldset><legend>Turn (degrees)</legend><div id="turns"></div></fieldset>
 <fieldset><legend>Move (cm)</legend><div id="moves"></div></fieldset>
 <div class="actions"><button id="reset">Reset sliders</button><button id="copy">Copy numbers</button></div>
 <div class="actions" style="margin-top:10px"><button id="save" class="main">Save as default</button><button id="unsave">Undo saved defaults</button></div>
 <pre id="out"></pre>
</aside>
<script type="module" src="/src/tune.ts"></script>
</body></html>
