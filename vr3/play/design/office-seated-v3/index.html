<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seated office v3</title><style>body{background:#17191e;color:#eee;font:16px system-ui;max-width:1500px;margin:32px auto;padding:0 24px}p{color:#bbb}button,select{padding:10px;margin:4px;background:#30343f;color:white;border:1px solid #667;border-radius:4px}.scene{position:relative;aspect-ratio:3;margin:20px 0}.scene img{position:absolute;width:100%;height:100%}#after{opacity:0}label{display:block;margin:16px 0}input{width:70%}.props{display:grid;grid-template-columns:1fr 1fr;gap:12px}.props img{width:100%;height:400px;object-fit:contain;background:#222}a{color:#bbdafa}h2{margin-top:40px}</style><h1>Seated office · v3</h1><p>Lower, closer workstation. Compare daylight, twilight and night with furnished or completely empty desktop.</p><label>Desk <select id="desk"><option value="">Furnished</option><option value="empty-">Empty</option></select> Lighting endpoint <select id="lighting"><option value="twilight">Twilight</option><option value="night">Night</option></select></label><div class="scene"><img id="before" src="day.webp" alt="Daylight seated office"><img id="after" src="twilight.webp" alt="Selected end lighting"></div><label>Daylight <input id="blend" type="range" min="0" max="100" value="0"> <output id="value">0%</output></label><p id="links"></p><main id="props"></main><script>
const desk=document.querySelector('#desk'),lighting=document.querySelector('#lighting'),after=document.querySelector('#after');function refresh(){const p=desk.value;document.querySelector('#before').src=p+'day.webp';after.src=p+lighting.value+'.webp';document.querySelector('#links').innerHTML=['day','twilight','night'].map(x=>`<a href="${p+x}.png">${x} PNG</a>`).join(' · ')}desk.onchange=lighting.onchange=refresh;document.querySelector('#blend').oninput=e=>{after.style.opacity=e.target.value/100;document.querySelector('#value').value=e.target.value+'%'};refresh();for(const [id,name] of [['crt-monitor','CRT monitor'],['paper','Paper'],['stapler','Stapler']]){document.querySelector('#props').innerHTML+=`<h2>${name}</h2><div class="props"><a href="props/${id}-hero.png"><img src="props/${id}-hero.png" alt="${name} hero"></a><a href="props/${id}-angles.png"><img src="props/${id}-angles.png" alt="${name} model angles"></a></div>`}
</script></html>
