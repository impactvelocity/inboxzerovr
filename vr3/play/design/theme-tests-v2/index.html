<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VR3 theme tests v2</title>
<style>body{margin:32px auto;padding:0 24px;max-width:1400px;background:#151719;color:#eee;font:16px system-ui}h1{font-size:32px}p{color:#aaa}section{margin:48px 0}h2{font-size:24px}.panorama{position:relative;aspect-ratio:3;background:#222}.panorama img{position:absolute;width:100%;height:100%}.end{opacity:0}label{display:flex;gap:16px;align-items:center;margin:16px 0}input{flex:1}.props{display:grid;grid-template-columns:1fr 2fr;gap:16px}.props img{width:100%;height:400px;object-fit:contain;background:#222}a{color:#b9d9ed}@media(max-width:700px){.props{grid-template-columns:1fr}.props img{height:auto}}</style>
<h1>VR3 · Reference-matched theme tests</h1><p>Slide from start lighting to end lighting. Check structural edges around the halfway point. These are concept references; headset projection and runtime effects still need validation.</p><main id="themes"></main>
<script>
for(const [id,title] of [['chemical','Chemical / Biohazard'],['crt-office','CRT Office'],['boxing','Boxing'],['castle','Castle']]){
const section=document.createElement('section');section.innerHTML=`<h2>${title}</h2><div class="panorama"><img src="${id}/start.webp" alt="${title} start lighting"><img class="end" src="${id}/end.webp" alt="${title} end lighting"></div><label>Start<input aria-label="${title} lighting transition" type="range" min="0" max="100" value="0">End <output>0%</output></label><div class="props"><a href="${id}/weapon-hero.png"><img src="${id}/weapon-hero.png" alt="${title} weapon hero"></a><a href="${id}/weapon-angles.png"><img src="${id}/weapon-angles.png" alt="${title} weapon views"></a></div><p><a href="${id}/prompts.md">Prompts</a> · <a href="${id}/start.png">Start PNG</a> · <a href="${id}/end.png">End PNG</a></p>`;
section.querySelector('input').oninput=e=>{section.querySelector('.end').style.opacity=e.target.value/100;section.querySelector('output').value=e.target.value+'%'};document.querySelector('main').append(section);
}
</script></html>
