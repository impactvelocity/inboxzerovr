<!doctype html><html><head><meta charset="utf-8"><title>Round 2</title><link rel="stylesheet" href="style.css">
<style>
  .card { height: 1180px; }
  .head { padding-top: 168px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 70px 64px 0; }
  .pair h2 { margin: 34px 0 0; font-size: 42px; font-weight: 600; letter-spacing: -.02em; display: flex; align-items: center; gap: 18px; }
  .pair p { margin: 12px 0 0; font-size: 28px; line-height: 1.42; color: var(--soft); }
  .shot { aspect-ratio: 16 / 9; }
</style></head><body>
<div class="card">
  <img class="logo" src="assets/logo-small.webp" alt="Inbox Zero">
  <div class="built"><img src="assets/meta-mark.svg">Built for Meta VR Hackathon</div>
  <div class="head center">
    <h1>Round 2: <em>reply</em></h1>
    <p class="sub">Every email you kept comes back.</p>
  </div>
  <div class="pair">
    <div>
      <img class="shot" src="assets/r2-pick.jpg">
      <h2><span class="chip cyan">Pick one</span>Use a pre-written reply</h2>
      <p>Pick one of two replies your agent wrote. Drag the email and hover over it to send.</p>
    </div>
    <div>
      <img class="shot" src="assets/r2-mic.jpg">
      <h2><span class="chip pink">Or say it</span>Use your mic</h2>
      <p>Say your reply out loud and AI transcribes it to text. Send it, or redo it.</p>
    </div>
  </div>
</div></body></html>
