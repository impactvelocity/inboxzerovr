<!doctype html><html><head><meta charset="utf-8"><title>Hero banner</title><link rel="stylesheet" href="style.css">
<style>
  .card { height: 430px; }
  .art {
    position: absolute; right: 0; top: 0; bottom: 0; width: 1240px;
    background: url(assets/hero-slash.webp) 50% 36% / cover;
    -webkit-mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,.6) 22%, #000 48%);
  }
  .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,7,24,.55), transparent 40%); }
  .left { position: absolute; left: 64px; top: 50%; transform: translateY(-50%); width: 700px; display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
  .lockup { position: relative; display: block; line-height: 0; }
  .event { font-family: 'Silkscreen', monospace; font-size: 24px; letter-spacing: .06em; color: var(--lav); margin: 0 0 4px 2px; text-shadow: 3px 3px 0 var(--ink); }
  .big { width: 600px; margin-left: -12px; filter: drop-shadow(0 10px 0 rgba(10,4,30,.7)); }
  .vr {
    position: absolute; right: -78px; top: -14px; transform: rotate(6deg);
    font-family: 'Silkscreen', monospace; font-size: 36px; line-height: 1; color: var(--ink);
    background: var(--cyan); padding: 12px 16px 14px;
    box-shadow: 0 0 0 6px var(--ink), 10px 10px 0 6px var(--pink);
  }
  .tag { margin: 8px 0 0; font-family: 'Silkscreen', monospace; font-size: 38px; line-height: 1.25; font-weight: 400; text-shadow: 4px 4px 0 var(--ink); }
  .tag em { font-style: normal; color: var(--pink); }
  .url { position: absolute; right: 64px; bottom: 40px; background: #fff; color: var(--ink); box-shadow: 0 0 0 4px var(--ink), 8px 8px 0 4px var(--pink); }
</style></head><body>
<div class="card">
  <div class="art"></div>
  <div class="left">
    <div class="event">Meta Start Hackathon</div>
    <span class="lockup"><img class="big" src="assets/logo-space.webp" alt="Inbox Zero"><span class="vr">VR</span></span>
    <p class="tag">Slash, Burn and Smash<br><em>Your Way to Inbox Zero</em></p>
  </div>
  <span class="btn url">▶ Play at InboxZeroVR.com</span>
</div></body></html>
